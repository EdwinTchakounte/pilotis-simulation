<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilotis - visualisation du flow</title>
<style>
  :root{
    --bg:#F5F7FC; --surface:#FFFFFF; --ink:#2B3346; --mute:#7B879E; --line:#E8ECF6; --line2:#F0F3FA;
    --blue:#5B84EF; --teal:#33A99B; --violet:#8A72E2; --amber:#E4A250; --green:#46A873; --red:#DC7E7E;
    --grey:#9AA6BC; --sky:#5AB6E0;
    --shadow:0 8px 24px rgba(43,51,70,.06);
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#141a26; --surface:#1b2333; --ink:#E7ECF6; --mute:#9AA6BC; --line:#28324a; --line2:#212a3e;
    --shadow:0 8px 24px rgba(0,0,0,.25);}}
  :root[data-theme="dark"]{
    --bg:#141a26; --surface:#1b2333; --ink:#E7ECF6; --mute:#9AA6BC; --line:#28324a; --line2:#212a3e;
    --shadow:0 8px 24px rgba(0,0,0,.25);}
  :root[data-theme="dark"] .cap{background:#202a40;color:#cdd7ea}
  :root[data-theme="dark"] .cap-note{color:#cdd7ea}
  :root[data-theme="dark"] .holdercol{background:#1b2333}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:12px 14px 4px;max-width:none;margin:0}
  .hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px}
  header p{margin:3px 0 0;color:var(--mute);font-size:13px}
  .tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;flex:0 0 auto}
  .tbtn:hover{border-color:var(--blue)}
  .tbtn .ic{width:15px;height:15px}
  .tabs{display:flex;gap:6px;max-width:none;margin:8px 0 0;padding:0 14px}
  .tabs button{background:var(--surface);border:1px solid var(--line);color:var(--mute);border-radius:999px;
    padding:9px 18px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.2s}
  .tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 14px rgba(91,132,239,.3)}
  main{max-width:none;margin:0;padding:12px 14px 18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
  .ctrl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  select,.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;
    padding:9px 14px;font-size:13.5px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn.ghost{background:var(--line2)}
  .speed{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12.5px;margin-left:auto}
  .speed input{accent-color:var(--blue)}
  .cap{background:linear-gradient(180deg,#f2f6ff,#eef3ff);border:1px solid var(--line);border-radius:14px;
    padding:12px 16px;font-weight:700;font-size:13.5px;margin-bottom:14px;color:#39435c}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cap{background:#202a40;color:#cdd7ea}}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);
    border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .lg .sw{width:10px;height:10px;border-radius:50%}
  .grid{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  /* 3 colonnes plein ecran : dossier | topologie | journal (sans scroll de page) */
  .grid3{display:grid;grid-template-columns:290px minmax(0,1fr) 320px;gap:14px;align-items:stretch}
  @media(max-width:1080px){.grid3{grid-template-columns:1fr}}
  .grid3 .col{min-width:0}
  .holdercol{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fbfcff,#f6f9ff);border:1px solid var(--line);border-radius:16px;padding:8px}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .holdercol{background:#1b2333}}
  .pk-svg{width:100%;height:auto;display:block;max-height:60vh;border-radius:12px}
  .pk-edge{stroke:var(--line);stroke-width:2.5;fill:none}
  .pk-edge.on{stroke:var(--sky);stroke-width:4}
  .pk-node rect{transition:all .3s}
  .pk-node.on rect{stroke-width:3.5;filter:drop-shadow(0 4px 10px rgba(91,132,239,.25))}
  .pk-node .t{font-weight:800;font-size:14px}
  .pk-node .s{font-size:11px}
  .logwrap{border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .logh{padding:11px 14px;font-weight:800;font-size:13px;border-bottom:1px solid var(--line)}
  .log{max-height:58vh;overflow:auto;padding:6px 12px}
  .logit{display:flex;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--line);font-size:12px;align-items:flex-start}
  .logit:last-child{border-bottom:0}
  .logit .sw{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:0 0 auto}
  .logit .k{font-weight:800;white-space:nowrap}
  .logit .d{color:var(--mute)}
  .logit .rf{display:block;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--blue)}
  .dossier{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px;align-self:stretch;overflow:auto;max-height:70vh}
  .dossier-h{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px;margin-bottom:10px}
  .dossier-h .uico{color:var(--amber)}
  .dossier-ref{font-size:12.5px;color:var(--mute);margin-bottom:12px}
  .dossier-ref b{color:var(--ink);font-family:ui-monospace,Menlo,monospace}
  .dossier-empty{font-size:12.5px;color:var(--mute);line-height:1.55;background:var(--line2);border-radius:12px;padding:12px}
  .constats{display:grid;grid-template-columns:1fr;gap:10px}
  .cst{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .cst .top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;align-items:center}
  .cbar{height:7px;background:var(--line2);border-radius:5px;overflow:hidden;margin-top:8px}
  .cbar>i{display:block;height:100%;width:0;border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  /* recurrent */
  .entwrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.entwrap{grid-template-columns:1fr}}
  .ent{border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .ent .eh{padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center}
  .ent .eh .p{font-weight:800}
  .gauge{height:12px;background:rgba(255,255,255,.35);border-radius:8px;overflow:hidden;margin-top:8px}
  .gauge>i{display:block;height:100%;background:#fff;width:0;transition:width .2s linear}
  .tiles{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
  .tile{width:70px;border:1px solid var(--line);border-radius:10px;padding:7px 6px;font-size:9.5px;color:var(--mute)}
  .tile .id{font-weight:800;color:var(--ink);font-size:10.5px}
  .tbar{height:6px;background:var(--line2);border-radius:4px;overflow:hidden;margin-top:6px}
  .tbar>i{display:block;height:100%;width:0;border-radius:4px;transition:width .25s linear}
  .sumrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .sum{flex:1;min-width:120px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .sum .n{font-size:22px;font-weight:800}
  .sum .l{font-size:11.5px;color:var(--mute);margin-top:2px}
  /* journal cliquable + drawer */
  .logit{cursor:pointer;border-radius:8px}
  .logit:hover{background:var(--line2)}
  .more{display:inline-block;margin-left:6px;font-size:10px;color:var(--blue);font-weight:700;opacity:.65}
  .pk-ov{position:fixed;inset:0;background:rgba(20,26,38,.35);opacity:0;pointer-events:none;transition:.25s;z-index:40}
  .pk-ov.on{opacity:1;pointer-events:auto}
  .pk-drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,94vw);background:var(--surface);
    border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(20,26,38,.14);transform:translateX(100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:50;overflow-y:auto;padding:22px}
  .pk-drawer.on{transform:translateX(0)}
  .dclose{float:right;border:1px solid var(--line);background:var(--line2);border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer;color:var(--ink)}
  .dtag{display:inline-block;padding:3px 12px;border-radius:999px;font-size:11.5px;font-weight:800;margin-bottom:10px}
  .pk-drawer h3{margin:2px 0 6px;font-size:16px;line-height:1.35}
  .dref{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--blue);margin-bottom:6px;word-break:break-word}
  .dsec{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
  .dsec h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute)}
  .dsec p{margin:0;font-size:13px}
  .dcasc{margin:0;padding-left:16px;font-size:12.5px}
  .dcasc li{margin-bottom:6px}
  .dchain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .dnode{border:1.5px solid;border-radius:10px;padding:6px 10px;font-size:11px;font-weight:700;background:var(--surface)}
  .darr{color:var(--mute);font-weight:800}
  .dnote{margin-top:12px;font-size:12px;color:var(--mute);font-style:italic}
  .dpj{padding-left:0;list-style:none}
  .dpj li{margin-bottom:7px}
  .pj{display:inline-block;background:#B678C422;color:#8A56A0;border-radius:5px;font-size:9px;font-weight:800;padding:1px 6px;margin-right:7px;letter-spacing:.3px;vertical-align:middle}
  /* caption enrichie, progression, agents, polish */
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--teal),var(--violet));z-index:60}
  .cap-head{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:7px}
  .cap-step{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
  .cchip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700}
  .cchip.act{background:var(--line2);color:var(--ink)}
  .cap-note{font-size:14px;font-weight:700;color:#39435c}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cap-note{color:#cdd7ea}}
  .cap-ref{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--blue);font-weight:600}
  .legend-ag{margin-top:-4px}
  .lgt{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;margin-right:2px;align-self:center}
  .agtag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:9.5px;font-weight:800;vertical-align:middle}
  .agchip{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:800}
  .agrole{margin:6px 0 0;font-size:12px;color:var(--mute)}
  .pk-prog{height:5px;background:var(--line2);border-radius:4px;overflow:hidden;margin-bottom:14px}
  .pk-prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:4px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes pkpulse{0%,100%{filter:drop-shadow(0 3px 8px rgba(91,132,239,.15))}50%{filter:drop-shadow(0 5px 16px rgba(91,132,239,.42))}}
  .pk-node.on rect{animation:pkpulse 1.5s ease-in-out infinite}
  #pk{filter:drop-shadow(0 0 5px rgba(51,169,155,.55))}
  /* avis experts */
  .fb-form{display:grid;gap:10px;max-width:640px}
  .fb-form label{font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.3px}
  .fb-form input,.fb-form textarea,.fb-form select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;font-family:inherit;background:var(--surface);color:var(--ink)}
  .fb-form textarea{min-height:92px;resize:vertical}
  .fb-verdicts{display:flex;gap:8px;flex-wrap:wrap}
  .fb-v{border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--surface);color:var(--ink)}
  .fb-list{margin-top:24px;display:grid;gap:10px}
  .fb-item{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .fb-item .h{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px}
  .fb-item .who{font-weight:800}
  .fb-item .fb-obl{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:700;color:var(--brandtxt,#39435c)}
  .fb-item .fb-obl .ic{width:13px;height:13px;color:var(--amber)}
  .fb-item .cmt{margin-top:7px;font-size:13px}
  .fb-item .meta{font-size:11px;color:var(--mute);margin-top:5px}
  .fb-note{font-size:12.5px;color:var(--mute)}
  .fb-autre{margin-top:2px}
  .al-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .al-d{flex:1;min-width:0;font-size:13px}
  .al-meta{display:block;color:var(--mute);font-size:11px;margin-top:2px}
  /* icones (sur elements + acteurs) */
  .ic{width:14px;height:14px;display:inline-block;flex:0 0 auto}
  .lg{display:inline-flex;align-items:center}
  .lgi{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:7px;margin-right:6px}
  .lgi .ic{width:12px;height:12px}
  .lico{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;margin-top:1px;flex:0 0 auto}
  .lico .ic{width:14px;height:14px}
  .cchip{display:inline-flex;align-items:center;gap:5px}
  .cchip .ic{width:13px;height:13px}
  .dtag{display:inline-flex;align-items:center;gap:6px}
  .dtag .ic{width:14px;height:14px}
  .agchip{display:inline-flex;align-items:center;gap:6px}
  .agtag{display:inline-flex;align-items:center;gap:4px}
  .agtag .ic{width:11px;height:11px}
  .dactor{display:flex;align-items:center;gap:7px;margin:0}
  .uico{display:inline-flex;color:var(--mute)}
  .pk-node rect{filter:drop-shadow(0 2px 7px rgba(43,51,70,.06))}
  .pk-node .t{font-size:13.5px}
  /* apparition douce des noeuds et des liens au lancement */
  @keyframes nodeIn{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes edgeIn{from{opacity:0}to{opacity:1}}
  .pk-node{transform-box:fill-box;transform-origin:center;animation:nodeIn .55s cubic-bezier(.2,.8,.2,1) both}
  .pk-edge{animation:edgeIn .7s ease .45s both}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  main>div>.card{animation:cardIn .4s ease both}
  @media (prefers-reduced-motion: reduce){.pk-node,.pk-edge,main>div>.card{animation:none}}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div>
      <h1>Pilotis - visualisation du flow</h1>
      <p>Parcours par declencheur et etat des obligations recurrentes. Animation a vitesse reglable.</p>
    </div>
    <button id="themeBtn" class="tbtn" type="button" title="Basculer clair / sombre">Sombre</button>
  </div>
</header>
<div class="tabs" id="tabs">
  <button data-v="referentiel" class="on">Referentiel &amp; revue</button>
  <button data-v="parcours">Simulation</button>
</div>
<main id="main"></main>

// ---- Drawer PARTAGE : detail cliquable d'une obligation / d'un reporting ----
// Reutilisable par toutes les vues (alertes, instanciation...). Un seul panneau,
// pose sur le body, referme au clic sur le fond.
let _iov=null,_idr=null;
function hideInfo(){if(_idr){_idr.classList.remove("on");_iov.classList.remove("on");}}
function showInfo(html){
  if(!_idr){_iov=el("div",{class:"pk-ov"});_idr=el("div",{class:"pk-drawer"});document.body.appendChild(_iov);document.body.appendChild(_idr);_iov.onclick=hideInfo;}
  _idr.innerHTML='<button class="dclose">Fermer</button>'+html;
  _idr.querySelector(".dclose").onclick=hideInfo;
  _idr.classList.add("on");_iov.classList.add("on");
}
// Le descriptif d'une obligation ou d'un reporting (objet issu de BC).
function obligationInfoHtml(o){
  const isRep=o.kind==="Reporting";
  const isAdd=!!o.added;
  const accent=isAdd?CO.teal:(isRep?CO.blue:CO.violet);
  const tag=isAdd?"Obligation (ajout expert)":(isRep?"Reporting":"Engagement");
  const declLbl=(typeof DECL!=="undefined"&&DECL[o.declencheur])?DECL[o.declencheur][0]:(o.declencheur||"");
  let h='<div class="dtag" style="background:'+accent+'22;color:'+accent+'">'+ico(isAdd?"upload":(isRep?"file":"shield"))+'<span>'+tag+'</span></div>';
  h+='<h3>'+clean(o.name||o.id)+'</h3>';
  h+='<div class="dref">'+clean(o.id||"")+(o.entite?' · '+clean(o.entite):'')+'</div>';
  h+='<div class="dsec"><h4>Caracteristiques</h4><ul class="dcasc">';
  if(declLbl)h+='<li>Declencheur : <b>'+clean(declLbl)+'</b></li>';
  if(o.evenement)h+='<li>Evenement declencheur : <b>'+clean(o.evenement)+'</b></li>';
  if(o.contenant)h+='<li>Contenant : '+(o.contenant==="operation"?"Operation (deal)":"Recurrent (societe)")+'</li>';
  if(o.periodicite)h+='<li>Periodicite : '+clean(o.periodicite)+'</li>';
  if(isRep&&o.deadline)h+='<li>Echeance : '+clean(o.deadline)+'</li>';
  if(o.domain)h+='<li>Domaine : '+clean(o.domain)+'</li>';
  h+='<li>Criticite : '+clean(o.crit||"non precisee")+'</li>';
  if(o.destinataire)h+='<li>Destinataire : <b>'+clean(o.destinataire)+'</b>'+(o.nature_dest?' ('+clean(o.nature_dest)+')':'')+'</li>';
  h+='</ul></div>';
  if(isAdd)h+='<div class="dnote">Ajoutee par l\'expert - telechargeable depuis l\'onglet Instanciation pour mettre a jour le referentiel.</div>';
  if(isRep&&o.sources&&o.sources.length){
    h+='<div class="dsec"><h4>Informations a rassembler pour la redaction</h4><ul class="dcasc">';
    o.sources.forEach(s=>{const ext=s.portee==="externe";const pc=ext?CO.amber:CO.teal;h+='<li>'+clean(s.info)+' <span class="badge" style="background:'+pc+'22;color:'+pc+'">'+(ext?"Externe":"Interne")+'</span></li>';});
    h+='</ul></div>';
  }
  return h;
}

// Drawer descriptif + REVUE (valider / rejeter / appreciation) d'une obligation.
function showObligation(o){
  const rv=(loadRev()[o.id]||{});
  let h=obligationInfoHtml(o);
  h+='<div class="dsec"><h4>Revue de l\'expert</h4>';
  h+='<div style="display:flex;gap:8px;margin:6px 0">';
  [["valide","Valider",CO.green],["rejete","Rejeter",CO.red]].forEach(([k,l,c])=>{
    const on=rv.verdict===k;
    h+='<button data-k="'+k+'" class="rvb" style="border:1px solid '+c+';border-radius:999px;padding:5px 16px;font-size:13px;font-weight:700;cursor:pointer;background:'+(on?c:"transparent")+';color:'+(on?"#fff":c)+'">'+l+'</button>';
  });
  h+='</div>';
  h+='<textarea id="rvappr" placeholder="Appreciation, correction, precision, ou ce qui manque..." style="width:100%;min-height:76px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;background:var(--surface);color:var(--ink);box-sizing:border-box">'+clean(rv.appreciation||"")+'</textarea>';
  h+='<button id="rvsave" class="btn primary" style="margin-top:8px">Enregistrer la revue</button>';
  h+='<span id="rvst" class="cap" style="padding:0;margin-left:8px"></span></div>';
  showInfo(h);
  let verdict=rv.verdict||"";
  _idr.querySelectorAll(".rvb").forEach(b=>b.onclick=()=>{verdict=b.getAttribute("data-k");
    _idr.querySelectorAll(".rvb").forEach(x=>{const k=x.getAttribute("data-k");const c=k==="valide"?CO.green:CO.red;const on=k===verdict;x.style.background=on?c:"transparent";x.style.color=on?"#fff":c;});});
  _idr.querySelector("#rvsave").onclick=()=>{const r=loadRev();
    r[o.id]={id:o.id,name:o.name,event:o.event||"",entite:o.entite||"",kind:o.kind||"",verdict:verdict,appreciation:_idr.querySelector("#rvappr").value.trim(),ts:Date.now()};
    saveRev(r);hideInfo();draw();};
}

  name:(typeof it==="string"?it:(it.obligation||"")),kind:"Obligation",declencheur:"event_based",

// Section templates : par reporting, l'expert charge des exemples de template
// (texte), numerotes 1,2,3... et nommes selon la nomenclature du reporting.
// La simulation stocke en local ; le vrai stockage MinIO se fait cote atelier
// du front reel. La nomenclature affichee est celle qui serait utilisee serveur.
function templatesSection(){
  const card=el("div",{class:"card",style:"border-left:4px solid "+CO.sky});
  card.appendChild(el("h3",{style:"margin:0 0 2px;font-size:16px;font-weight:800",html:'<span style="display:inline-flex;vertical-align:-3px;margin-right:6px;color:'+CO.sky+'">'+ico("upload")+'</span>Templates de reporting (documents rattaches)'}));
  card.appendChild(el("p",{class:"cap",style:"margin:2px 0 12px;padding:0"},
    "Chargez le DOCUMENT template de chaque reporting (Word, PDF, Excel, texte...). Plusieurs exemples possibles, numerotes 1, 2, ... et nommes selon la nomenclature du reporting. Stockage MinIO cote serveur ; ici en local, telechargeables."));
  const reps=BC.filter(o=>o.kind==="Reporting"&&o.entite===refEnt);
  const MAXB=1.4*1024*1024;
  function ext(fn){const m=/\.([a-z0-9]+)$/i.exec(fn||"");return m?m[1].toLowerCase():"txt";}
  function nomencl(repId,n,e){return "reportings/"+repId+"/"+repId+"__tpl_"+n+"."+e;}
  function fmtSize(b){return b<1024?b+" o":(b<1048576?(b/1024).toFixed(0)+" Ko":(b/1048576).toFixed(1)+" Mo");}

  // Apercu par reporting : chaque reporting et son nombre de templates (cliquable).
  const overview=el("div",{style:"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"});
  const selRow=el("div",{style:"display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px"});
  const selR=el("select",{style:"border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--surface);color:var(--ink);min-width:320px"});
  reps.forEach(r=>selR.appendChild(el("option",{value:r.id},(r.id?r.id+" - ":"")+clean((r.name||"").slice(0,52)))));
  selRow.appendChild(el("span",{class:"cap",style:"padding:0;font-weight:700"},"Reporting :"));selRow.appendChild(selR);
  card.appendChild(overview);card.appendChild(selRow);

  // Zone de depot (dropzone) + nom + texte optionnel.
  const drop=el("label",{style:"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:14px;padding:18px;cursor:pointer;background:var(--surface);text-align:center"});
  const fileI=el("input",{type:"file",style:"display:none"});
  drop.appendChild(el("span",{style:"color:"+CO.sky+";display:inline-flex",html:ico("upload")}));
  const dropTxt=el("span",{class:"cap",style:"padding:0;font-weight:700"},"Deposer un document template (ou cliquer) - Word, PDF, Excel, texte...");
  const dropSub=el("span",{class:"cap",style:"padding:0;font-size:11px"},"Aucun fichier choisi");
  drop.appendChild(dropTxt);drop.appendChild(dropSub);drop.appendChild(fileI);
  let picked=null;
  drop.ondragover=e=>{e.preventDefault();drop.style.borderColor=CO.sky;};
  drop.ondragleave=()=>{drop.style.borderColor="var(--line)";};
  drop.ondrop=e=>{e.preventDefault();drop.style.borderColor="var(--line)";const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f){picked=f;dropSub.textContent=f.name+" ("+fmtSize(f.size)+")";if(!nameI.value)nameI.value=f.name;}};
  fileI.onchange=()=>{const f=fileI.files&&fileI.files[0];if(f){picked=f;dropSub.textContent=f.name+" ("+fmtSize(f.size)+")";if(!nameI.value)nameI.value=f.name;}};
  card.appendChild(drop);
  const nameI=el("input",{type:"text",placeholder:"Nom du template (ex: modele COSUMAF v1)",style:"border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box;margin-top:10px"});
  card.appendChild(nameI);
  const ta=el("textarea",{placeholder:"Ou coller directement un contenu texte (optionnel, si pas de fichier)",style:"width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;background:var(--surface);color:var(--ink);box-sizing:border-box;margin-top:8px"});
  card.appendChild(ta);
  const addB=el("button",{class:"btn primary",style:"margin-top:8px"},"Ajouter le template");
  const st=el("span",{class:"cap",style:"padding:0;margin-left:8px"},"");
  const rowb=el("div",{style:"margin-top:8px"});rowb.appendChild(addB);rowb.appendChild(st);card.appendChild(rowb);
  const listWrap=el("div",{style:"display:flex;flex-direction:column;gap:6px;margin-top:12px"}); card.appendChild(listWrap);

  function renderOverview(){overview.innerHTML="";const t=loadTpl();
    reps.forEach(r=>{const c=(t[r.id]||[]).length;const on=r.id===selR.value;
      const chip=el("button",{style:"border:1px solid "+(c?CO.sky:"var(--line)")+";border-radius:999px;padding:4px 10px;font-size:11px;cursor:pointer;background:"+(on?CO.sky:(c?CO.sky+"14":"transparent"))+";color:"+(on?"#fff":(c?CO.sky:"var(--mute)"))},r.id+" ("+c+")");
      chip.onclick=()=>{selR.value=r.id;render();};overview.appendChild(chip);});
  }
  function render(){
    renderOverview();
    listWrap.innerHTML="";const t=loadTpl();const repId=selR.value;const arr=(t[repId]||[]);
    listWrap.appendChild(el("div",{class:"cap",style:"padding:0;font-weight:700"},arr.length+" template(s) pour "+repId));
    arr.forEach(x=>{
      const it=el("div",{style:"display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px"});
      const meta=(x.filename?clean(x.filename)+" · "+fmtSize(x.size||0)+(x.stored?"":" (metadonnees seules - trop volumineux en local)"):(x.content?x.content.length+" caracteres":""));
      it.appendChild(el("div",{style:"min-width:0",html:'<div style="font-size:12.5px;font-weight:600;color:var(--ink)">'+x.n+' - '+clean(x.name)+'</div><div class="cap" style="padding:0;font-size:11px">'+clean(x.nomenclature)+'</div><div class="cap" style="padding:0;font-size:11px">'+meta+'</div>'}));
      const acts=el("div",{style:"display:flex;gap:6px;flex-shrink:0"});
      if(x.dataUrl){const bd=el("a",{class:"btn ghost",href:x.dataUrl,download:(x.filename||repId+"_tpl_"+x.n)});bd.textContent="Telecharger";acts.appendChild(bd);}
      else if(x.content){const bd=el("button",{class:"btn ghost"},"Telecharger");bd.onclick=()=>dlFile(repId+"__tpl_"+x.n+".txt",x.content,"text/plain;charset=utf-8");acts.appendChild(bd);}
      const br=el("button",{class:"btn ghost"},"Retirer");br.onclick=()=>{const tt=loadTpl();tt[repId]=(tt[repId]||[]).filter(y=>y.n!==x.n);saveTpl(tt);render();};
      acts.appendChild(br);it.appendChild(acts);listWrap.appendChild(it);
    });
  }
  selR.onchange=render;
  function commit(entry){const t=loadTpl();const repId=selR.value;const arr=t[repId]||[];const n=arr.length+1;
    entry.n=n;entry.nomenclature=nomencl(repId,n,entry.ext||"txt");entry.ts=Date.now();
    arr.push(entry);t[repId]=arr;try{saveTpl(t);}catch(e){st.textContent="Stockage local plein - reduisez la taille.";return;}
    picked=null;fileI.value="";dropSub.textContent="Aucun fichier choisi";nameI.value="";ta.value="";
    st.textContent="Template "+n+" ajoute ("+entry.nomenclature+").";render();}
  addB.onclick=()=>{const repId=selR.value;const nm=nameI.value.trim()|| (picked?picked.name:"template");
    if(picked){const f=picked;const e=ext(f.name);
      if(f.size>MAXB){commit({name:nm,filename:f.name,mime:f.type,size:f.size,ext:e,stored:false});return;}
      const rd=new FileReader();rd.onload=()=>commit({name:nm,filename:f.name,mime:f.type,size:f.size,ext:e,dataUrl:String(rd.result||""),stored:true});rd.readAsDataURL(f);return;}
    const c=ta.value.trim();if(!c){st.textContent="Deposez un document ou collez un texte.";return;}
    commit({name:nm,content:c.slice(0,20000),ext:"txt",size:c.length,stored:true});};
  render();
  return card;
}

// Exports : la revue (CSV a partager) et tout (JSON : revue + ajouts + templates).

const MONTHS=["janvier","fevrier","mars","avril","mai","juin","juillet","aout","septembre","octobre","novembre","decembre"];
function bnorm(s){return (s==null?"":String(s)).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function recurrentView(){
  const wrap=el("div");
  const card=el("div",{class:"card"});

  const tl=el("span",{class:"lg"},"t = 0");
  ctrl.appendChild(play);ctrl.appendChild(reset);ctrl.appendChild(tl);ctrl.appendChild(sp); card.appendChild(ctrl);
  card.appendChild(el("div",{class:"cap"},"Simulation de l'exercice : les cycles de reporting se consolident dans le temps. Cliquez un cycle pour son descriptif (informations a rassembler, interne/externe)."));
  const ents=[["ACT-SDG","Financia-Gestion (SGP)",CO.blue],["ACT-SDB","Financia-Bourse",CO.violet]];
  const N=44;
  // Un cycle -> l'obligation de reporting correspondante dans la base (pour le drawer).
  function cycleObj(c,tid){
    const ent=tid==="ACT-SDG"?"Financia-Gestion":"Financia-Bourse";
    const nn=bnorm(c.name||"");
    const match=BC.filter(o=>o.kind==="Reporting"&&o.entite===ent).find(o=>{const bn=bnorm(o.name);return bn&&nn&&(bn.indexOf(nn)>=0||nn.indexOf(bn)>=0);});
    if(match)return match;
    return {id:c.id,name:c.name,kind:"Reporting",entite:ent,crit:c.criticality||"",periodicite:c.frequency||"",deadline:c.deadline||"",declencheur:"calendar",destinataire:"COSUMAF",nature_dest:"externe",sources:[]};
  }
  function sched(c,idx){const b=bnorm(c.deadline)+" "+bnorm(c.frequency);let mo=null;MONTHS.forEach((m,k)=>{if(b.indexOf(m)>=0)mo=k;});
    const start= mo==null? 2+(idx%6) : Math.round(2+(mo/11)*(N*0.55)); const end=start+7;
    const st=c.state; let cap=1,color=CO.green; if(st==="awaiting_signal"){cap=.7;color=CO.amber;} else if(st==="open"){cap=.55;color=CO.blue;}
    return {c,start,end,cap,color};}
  const scheds={}; ents.forEach(([tid])=>{scheds[tid]=DATA.cycles.filter(c=>c.tenant===tid).map((c,i)=>sched(c,i));});
  const entwrap=el("div",{class:"entwrap"}); const refs={};
  ents.forEach(([tid,lab,col])=>{

    const row=el("div",{style:"flex:1;margin-right:12px"}); row.appendChild(el("div",{style:"display:flex;justify-content:space-between",html:''}));
    eh.appendChild(gtxt); eh.appendChild(gpct);
    const g=el("div",{class:"gauge"}); const gi=el("i"); g.appendChild(gi);
    const ehcol=el("div",{style:"flex:1"}); ehcol.appendChild(eh);
    ent.appendChild(eh); ent.appendChild(g);
    const tiles=el("div",{class:"tiles"}); const tref=[];
    scheds[tid].forEach(s=>{const tile=el("div",{class:"tile",style:"cursor:pointer"});const idc=(s.c.id||"").split("-").pop();
      tile.appendChild(el("div",{class:"id"},idc||"?")); tile.appendChild(el("div",{},clean(s.c.name||"").slice(0,18)));
      const tb=el("div",{class:"tbar"});const ti=el("i");tb.appendChild(ti);tile.appendChild(tb);tiles.appendChild(tile);tref.push({s,ti});
      tile.onclick=()=>showInfo(obligationInfoHtml(cycleObj(s.c,tid)));});
    ent.appendChild(tiles); entwrap.appendChild(ent); refs[tid]={gi,gpct,tref};
  });
  card.appendChild(entwrap);
  // resume etats
  const sumrow=el("div",{class:"sumrow"});
  const byS={}; DATA.cycles.forEach(c=>byS[c.state]=(byS[c.state]||0)+1);
  const LB={closed:["Clotures",CO.green],closed_with_reservation:["Avec reserve",CO.teal],awaiting_signal:["Attend signal",CO.amber],open:["Ouverts",CO.grey]};
  Object.entries(byS).forEach(([k,v])=>{const [l,c]=LB[k]||[k,CO.grey];sumrow.appendChild(el("div",{class:"sum",html:'<div class="n" style="color:'+c+'">'+v+'</div><div class="l">'+l+'</div>'}));});
  card.appendChild(sumrow);
  wrap.appendChild(card);
  let t=0,playing=false,timer=null;
  stopFns.push(()=>{if(timer)clearInterval(timer);});
  rg.oninput=()=>{speedVal=+rg.value; if(playing){clearInterval(timer);timer=setInterval(step,220*mul());}};
  function prog(s){if(t<s.start)return 0;return Math.min(s.cap,(t-s.start)/Math.max(1,s.end-s.start));}
  function render(){tl.textContent="t = "+t;
    ents.forEach(([tid])=>{const R=refs[tid];let sum=0,n=0;R.tref.forEach(({s,ti})=>{const p=prog(s);ti.style.width=Math.round(p*100)+"%";ti.style.background=p>=1?CO.green:s.color;sum+=p;n++;});
      const fr=n?sum/n:0;R.gi.style.width=Math.round(fr*100)+"%";R.gpct.textContent=Math.round(fr*100)+"%"+(t>=N-2&&fr>.9?" ENVOYE":"");});}
  function step(){t=(t+1)%N; if(t===0){/*loop*/} render(); }
  play.onclick=()=>{if(playing){playing=false;play.textContent="Play";clearInterval(timer);}else{playing=true;play.textContent="Pause";timer=setInterval(step,220*mul());}};
  reset.onclick=()=>{playing=false;play.textContent="Play";clearInterval(timer);t=0;render();};
  render();
  return wrap;
}

    b.onclick=()=>{selEnt=v;[...fbar.children].forEach((bb,j)=>{const on=filtres[j][0]===selEnt;bb.className="fb-v"+(on?" on":"");bb.style.background=on?CO.blue:"";bb.style.borderColor=on?CO.blue:"";bb.style.color=on?"#fff":"";});renderCrit();};
    fbar.appendChild(b);});
  cc.appendChild(fbar); cc.appendChild(holder); renderCrit();
  wrap.appendChild(cc);

  // -- Inventaire des reportings : information necessaire a la redaction (interne/externe) --
  const rep=el("div",{class:"card",style:"margin-top:16px"});
  rep.appendChild(el("h3",{style:"margin:0 0 4px;font-size:15px;font-weight:800"},"Reportings : information necessaire a la redaction"));
  rep.appendChild(el("p",{class:"fb-note",style:"margin:0 0 14px"},
    "Pour chaque reporting, ce qu'il faut rassembler pour le rediger, et l'origine de chaque information : INTERNE (systemes de la societe) ou EXTERNE (tiers - depositaire, CAC, regulateur). Le badge du destinataire dit si le reporting lui-meme part en externe."));
  const reps=BC.filter(o=>o.kind==="Reporting");
  const PORT={interne:["Interne",CO.teal],externe:["Externe",CO.amber]};
  const rgrid=el("div",{style:"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px"});
  reps.forEach(o=>{
    const [dl,dc]=PORT[o.nature_dest||"externe"];
    const box=el("div",{style:"border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);cursor:pointer"});
    box.onclick=()=>showInfo(obligationInfoHtml(o));
    const hd=el("div",{style:"display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)"});
    hd.appendChild(el("div",{style:"min-width:0",html:'<div style="font-weight:700;font-size:13px;color:var(--ink)">'+clean((o.name||o.id).slice(0,60))+'</div><div class="cap" style="padding:0;font-size:11px">'+clean(o.entite)+(o.periodicite?' · '+clean(o.periodicite.slice(0,26)):'')+'</div>'}));
    hd.appendChild(el("span",{style:"flex-shrink:0;font-size:10px;font-weight:800;color:"+dc+";background:"+dc+"1e;border-radius:8px;padding:3px 8px;white-space:nowrap"},dl));
    box.appendChild(hd);
    const body=el("div",{style:"padding:10px 12px"});
    body.appendChild(el("div",{class:"cap",style:"padding:0;margin:0 0 6px;font-size:10px;letter-spacing:.4px;font-weight:700"},"INFORMATIONS A RASSEMBLER"));
    const srcs=o.sources||[];
    if(!srcs.length)body.appendChild(el("div",{class:"cap",style:"padding:0;font-size:11px"},"Sources a preciser."));
    else srcs.forEach(s=>{const [pl,pc]=PORT[s.portee]||PORT.interne;
      const row=el("div",{style:"display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;font-size:12px;border-top:1px dashed var(--line)"});
      row.appendChild(el("span",{style:"color:var(--ink)"},clean(s.info)));
      row.appendChild(el("span",{style:"flex-shrink:0;font-size:9px;font-weight:800;color:"+pc+";background:"+pc+"1e;border-radius:6px;padding:1px 6px"},pl));
      body.appendChild(row);});
    body.appendChild(el("div",{class:"more",style:"margin-top:8px;display:inline-block"},"voir le descriptif"));
    box.appendChild(body);
    rgrid.appendChild(box);
  });
  rep.appendChild(rgrid);
  wrap.appendChild(rep);
  return wrap;
}
/* ================= INSTANCIATION (le modele simple) =================
   Creer une instance -> elle nait avec des obligations PAR DEFAUT (le socle
   recurrent). Puis des ACTIONS en generent d'autres (ouvrir un dossier,
   un evenement, une echeance calendaire). C'est l'approche adoptee. */
let instEnt="Financia-Gestion";
const DECL={
  entry:["Condition d'acces",CO.amber,"A remplir avant d'exercer l'activite."],
  calendar:["Echeance calendaire",CO.blue,"Une echeance fixee par le calendrier."],
  event_based:["Sur evenement",CO.violet,"Declenchee par un fait de la vie de la societe ou du dossier."],
  conditional:["Sous condition",CO.grey,"Seulement si une condition est remplie."],
  continuous:["Permanent",CO.teal,"A respecter en tout temps, sans echeance."],
};
const DECL_ORDER=["entry","calendar","event_based","conditional","continuous"];

function instanciationView(){
  const wrap=el("div");

  // stockage local des obligations AJOUTEES par l'expert (telechargeables).
  const AJOUT_KEY="pilotis-obl-ajout";
  function loadAjout(){try{return JSON.parse(localStorage.getItem(AJOUT_KEY)||"[]");}catch(e){return [];}}
  function saveAjout(a){try{localStorage.setItem(AJOUT_KEY,JSON.stringify(a));}catch(e){}}
  function dlFile(name,txt,mime){const b=new Blob([txt],{type:mime});const u=URL.createObjectURL(b);const a=el("a",{href:u,download:name});document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}
  let ajouts=loadAjout();

  // -- 1. le fil : Console -> Instance nee -> Actions generent (numerote) --
  const flow=el("div",{class:"card",style:"border-top:3px solid "+CO.blue});
  flow.appendChild(el("h2",{style:"margin:0 0 2px;font-size:19px;font-weight:800"},"Comment nait une instance"));
  flow.appendChild(el("p",{class:"cap",style:"margin:0 0 16px;padding:0"},
    "On cree une instance dans la console : elle nait deja avec ses obligations PAR DEFAUT (le socle recurrent), puis des EVENEMENTS en declenchent d'autres au fil de l'eau. On ne raisonne plus 'creation de dossier' mais EVENEMENT."));
  const strip=el("div",{style:"display:flex;gap:0;flex-wrap:wrap;align-items:stretch"});
  const steps=[
    ["building","Console",CO.navy,"Le super-admin cree l'instance et instancie l'application pour la societe (le tenant)."],
    ["shield","Instance nee",CO.blue,"Elle s'ancre sur un socle d'entite : ses obligations recurrentes sont la, par defaut, rien a saisir."],
    ["play","Les evenements declenchent",CO.violet,"Une entree en relation, un ordre, une echeance, un changement... chaque EVENEMENT ouvre ou active des obligations."],
  ];
  steps.forEach((s,i)=>{
    const c=el("div",{style:"flex:1;min-width:210px;position:relative"});
    const box=el("div",{style:"height:100%;border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 18px;background:var(--surface);border-left:4px solid "+s[2]});
    const hd=el("div",{style:"display:flex;align-items:center;gap:10px"});
    hd.appendChild(el("span",{style:"display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:"+s[2]+";color:#fff;flex-shrink:0",html:ico(s[0])}));
    hd.appendChild(el("div",{style:"font-weight:800;font-size:14px;color:"+s[2],html:'<span style="font-size:11px;color:var(--mute);display:block;letter-spacing:.5px">ETAPE '+(i+1)+'</span>'+s[1]}));
    box.appendChild(hd);
    box.appendChild(el("div",{class:"cap",style:"margin-top:8px;padding:0"},s[3]));
    c.appendChild(box);
    strip.appendChild(c);
    if(i<steps.length-1)strip.appendChild(el("div",{style:"display:flex;align-items:center;padding:0 6px;color:var(--mute);font-size:20px;font-weight:700"},"→"));
  });
  flow.appendChild(strip);
  wrap.appendChild(flow);

  // -- selecteur de societe (segmented) --
  const selRow=el("div",{style:"display:flex;align-items:center;gap:12px;margin:4px 0 12px;flex-wrap:wrap"});
  selRow.appendChild(el("span",{class:"cap",style:"padding:0;font-weight:700"},"Societe :"));
  const sel=el("div",{style:"display:inline-flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px"});
  [["Financia-Gestion",CO.blue],["Financia-Bourse",CO.violet]].forEach(([lab,col])=>{
    const on=instEnt===lab;
    const b=el("button",{style:"border:0;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;background:"+(on?col:"transparent")+";color:"+(on?"#fff":"var(--mute)")},lab);
    b.onclick=()=>{instEnt=lab;draw();};
    sel.appendChild(b);
  });
  selRow.appendChild(sel);
  wrap.appendChild(selRow);

  // -- 2. obligations PAR DEFAUT (socle recurrent) + les AJOUTS de l'expert --
  const defaults=BC.filter(o=>o.entite===instEnt).map(o=>({name:o.name,declencheur:o.declencheur||"event_based",added:false,full:o}));
  const mesAjouts=ajouts.filter(a=>a.entite===instEnt).map(a=>({name:a.intitule,declencheur:a.declencheur,added:true,evenement:a.evenement,
    full:{name:a.intitule,declencheur:a.declencheur,crit:a.criticite,entite:instEnt,evenement:a.evenement,contenant:a.contenant,added:true}}));
  const all=defaults.concat(mesAjouts);
  const byDecl={}; all.forEach(o=>{(byDecl[o.declencheur]=byDecl[o.declencheur]||[]).push(o);});
  const def=el("div",{class:"card"});
  const defh=el("div",{style:"display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"});
  defh.appendChild(el("h3",{style:"margin:0;font-size:16px;font-weight:800"},"Le socle de la societe, par declencheur"));
  defh.appendChild(el("span",{class:"lg"},defaults.length+" par defaut"+(mesAjouts.length?" + "+mesAjouts.length+" ajout(s)":"")));
  def.appendChild(defh);
  def.appendChild(el("p",{class:"cap",style:"margin:2px 0 12px;padding:0"},
    "Ce que l'instance porte, organise par l'action qui l'ouvre. Cliquez une obligation pour son descriptif. Les ajouts de l'expert apparaissent ici, tagues."));
  const grid=el("div",{style:"display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px"});
  DECL_ORDER.forEach(d=>{
    const items=byDecl[d]; if(!items||!items.length)return;
    const [lab,col,hint]=DECL[d];
    const card=el("div",{style:"border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)"});
    const head=el("div",{style:"display:flex;justify-content:space-between;align-items:center;gap:6px;padding:10px 12px;background:"+col+"14;border-bottom:1px solid var(--line)"});
    head.appendChild(el("span",{style:"font-weight:800;font-size:13px;color:"+col+";display:flex;align-items:center;gap:6px",html:'<span style="width:9px;height:9px;border-radius:50%;background:'+col+';display:inline-block"></span>'+lab}));
    head.appendChild(el("span",{class:"lg"},String(items.length)));
    card.appendChild(head);
    card.appendChild(el("div",{class:"cap",style:"padding:6px 12px 4px;margin:0;font-size:11px"},hint));
    const ul=el("div",{style:"padding:0 12px 12px;display:flex;flex-direction:column;gap:6px"});
    items.slice(0,5).forEach(o=>{
      const row=el("div",{style:"font-size:12px;line-height:1.35;color:var(--ink);display:flex;gap:6px;align-items:baseline;cursor:pointer"});
      row.appendChild(el("span",{style:"color:"+col},"•"));
      const tx=el("span",{},clean(o.name).slice(0,74));
      row.appendChild(tx);
      if(o.added)row.appendChild(el("span",{style:"font-size:9px;font-weight:800;color:"+CO.green+";background:"+CO.green+"1e;border-radius:6px;padding:1px 5px;white-space:nowrap"},"AJOUTE"));
      if(o.full)row.onclick=()=>showInfo(obligationInfoHtml(o.full));
      ul.appendChild(row);
    });
    if(items.length>5)ul.appendChild(el("div",{class:"cap",style:"padding:0;margin:2px 0 0;font-size:11px"},"+ "+(items.length-5)+" autres"));
    card.appendChild(ul);
    grid.appendChild(card);
  });
  def.appendChild(grid);
  wrap.appendChild(def);

  // -- 2bis. CONTRIBUER : l'expert ajoute une obligation et definit son declencheur --
  const contrib=el("div",{class:"card",style:"border-left:4px solid "+CO.teal});
  contrib.appendChild(el("h3",{style:"margin:0 0 2px;font-size:16px;font-weight:800",html:'<span style="display:inline-flex;vertical-align:-3px;margin-right:6px;color:'+CO.teal+'">'+ico("upload")+'</span>Contribuer : ajouter une obligation'}));
  contrib.appendChild(el("p",{class:"cap",style:"margin:2px 0 14px;padding:0"},
    "L'expert ajoute une obligation et definit ce qui la declenche : un evenement DEJA PRESENT, ou un NOUVEL evenement. Les ajouts sont telechargeables (JSON/CSV) pour mettre a jour le referentiel."));

  const EVN=["Entree en relation (KYC)","Operation significative / ordre","Introduction en bourse (IPO)",
    "Modification du dossier d'agrement","Changement de dirigeant","Soupcon (LBC/FT)",
    "Echeance calendaire","Agrement (entree en activite)"];
  const fstyle="border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--surface);color:var(--ink);width:100%";
  const form=el("div",{style:"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;align-items:end"});
  function field(labtxt,node){const f=el("div",{style:"display:flex;flex-direction:column;gap:4px"});f.appendChild(el("label",{class:"cap",style:"padding:0;font-weight:700"},labtxt));f.appendChild(node);return f;}
  const inTitle=el("input",{type:"text",placeholder:"Intitule de l'obligation",style:fstyle});
  const inDecl=el("select",{style:fstyle}); DECL_ORDER.forEach(d=>inDecl.appendChild(el("option",{value:d},DECL[d][0])));
  inDecl.value="event_based";
  const inEvt=el("select",{style:fstyle});
  EVN.forEach(e=>inEvt.appendChild(el("option",{value:e},e)));
  inEvt.appendChild(el("option",{value:"__new__"},"+ Nouvel evenement..."));
  const inNew=el("input",{type:"text",placeholder:"Nom du nouvel evenement",style:fstyle+";display:none"});
  inEvt.onchange=()=>{inNew.style.display=inEvt.value==="__new__"?"block":"none";if(inEvt.value==="__new__")inNew.focus();};
  const inCont=el("select",{style:fstyle});
  [["recurrent","Recurrent (societe)"],["operation","Operation (deal)"]].forEach(([v,l])=>inCont.appendChild(el("option",{value:v},l)));
  const inCrit=el("select",{style:fstyle});
  ["critique","haute","moyenne","basse"].forEach(v=>inCrit.appendChild(el("option",{value:v},v)));
  inCrit.value="haute";
  const addBtn=el("button",{class:"btn primary",style:"height:38px"},"Ajouter l'obligation");
  const st=el("span",{class:"cap",style:"padding:0"},"");

  form.appendChild(field("Intitule",inTitle));
  form.appendChild(field("Declencheur",inDecl));
  const fEvt=field("Evenement declencheur",inEvt); fEvt.appendChild(inNew); form.appendChild(fEvt);
  form.appendChild(field("Contenant",inCont));
  form.appendChild(field("Criticite",inCrit));
  form.appendChild(field(" ",addBtn));
  contrib.appendChild(form);
  contrib.appendChild(el("div",{style:"margin-top:6px"},"")); contrib.lastChild.appendChild(st);

  // liste des ajouts + telechargement
  const alist=el("div",{style:"margin-top:12px;display:flex;flex-direction:column;gap:6px"});
  function renderAjouts(){
    alist.innerHTML="";
    const mine=ajouts.filter(a=>a.entite===instEnt);
    const bar=el("div",{style:"display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px"});
    bar.appendChild(el("span",{class:"cap",style:"padding:0;font-weight:700"},"Ajouts ("+mine.length+")"));
    const bj=el("button",{class:"btn ghost"},"Telecharger (JSON)");
    const bc2=el("button",{class:"btn ghost"},"Telecharger (CSV)");
    bj.onclick=()=>{if(!ajouts.length){st.textContent="Aucun ajout.";return;}dlFile("obligations-ajout-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(ajouts,null,2),"application/json");};
    bc2.onclick=()=>{if(!ajouts.length){st.textContent="Aucun ajout.";return;}
      const esc=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
      const head=["date","entite","intitule","declencheur","evenement","contenant","criticite"];
      const rows=ajouts.map(a=>[new Date(a.ts).toISOString(),a.entite,a.intitule,a.declencheur,a.evenement,a.contenant,a.criticite].map(esc).join(","));
      dlFile("obligations-ajout-"+new Date().toISOString().slice(0,10)+".csv",head.map(esc).join(",")+"\n"+rows.join("\n"),"text/csv;charset=utf-8");};
    bar.appendChild(bj); bar.appendChild(bc2);
    alist.appendChild(bar);
    mine.forEach(a=>{
      const declLabel=(DECL[a.declencheur]||[a.declencheur])[0];
      const it=el("div",{style:"display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px"});
      it.appendChild(el("div",{style:"min-width:0",html:'<div style="font-size:12.5px;font-weight:600;color:var(--ink)">'+clean(a.intitule)+'</div><div class="cap" style="padding:0;font-size:11px">'+declLabel+' · '+clean(a.evenement)+' · '+a.contenant+' · '+a.criticite+'</div>'}));
      const del=el("button",{class:"btn ghost",style:"flex-shrink:0"},"Retirer");
      del.onclick=()=>{ajouts=ajouts.filter(x=>x.ts!==a.ts);saveAjout(ajouts);draw();};
      it.appendChild(del);
      alist.appendChild(it);
    });
  }
  renderAjouts();
  contrib.appendChild(alist);

  addBtn.onclick=()=>{
    const titre=inTitle.value.trim();
    if(!titre){st.textContent="Donnez un intitule.";inTitle.focus();return;}
    let evt=inEvt.value; if(evt==="__new__"){evt=inNew.value.trim(); if(!evt){st.textContent="Nommez le nouvel evenement.";inNew.focus();return;}}
    ajouts.unshift({entite:instEnt,intitule:titre,declencheur:inDecl.value,evenement:evt,contenant:inCont.value,criticite:inCrit.value,ts:Date.now()});
    saveAjout(ajouts);
    st.textContent="Obligation ajoutee (visible dans le socle ci-dessus, telechargeable).";
    draw();
  };
  wrap.appendChild(contrib);

  // -- 3. les ACTIONS qui generent d'autres obligations --
  const act=el("div",{class:"card"});
  act.appendChild(el("h3",{style:"margin:0 0 2px;font-size:16px;font-weight:800"},"Les EVENEMENTS qui declenchent des obligations"));
  act.appendChild(el("p",{class:"cap",style:"margin:2px 0 12px;padding:0"},
    "Le socle ne bouge pas seul. Ce n'est pas 'creer un dossier' : c'est un EVENEMENT qui ouvre ou active des obligations. IA propose, l'humain decide."));
  const actions=[
    ["handoff",CO.violet,"Un evenement d'operation",
      "Entree en relation (KYC), ordre de marche, IPO... l'evenement OUVRE les obligations rattachees : les 'Condition d'acces' activees tout de suite, les 'Sur evenement' en sommeil jusqu'a leur fait.",
      "evenement d'operation -> obligations rattachees"],
    ["shield",CO.amber,"Un evenement de la vie de la societe",
      "Modification d'agrement, changement de dirigeant, soupcon LBC/FT, signal externe (visa, rapport CAC)... l'evenement ACTIVE les obligations en sommeil qui l'attendaient.",
      "evenement institution -> activation"],
    ["clipboard",CO.blue,"Une echeance calendaire",
      "L'echeance EST l'evenement calendaire : le balayage MATERIALISE un cycle de reporting recurrent (l'obligation par defaut devient un constat date a produire).",
      "echeance -> cycle de reporting"],
    ["user",CO.client,"Un retour au client (nature C)",
      "Certains evenements ouvrent une obligation ENVERS LE CLIENT (avis d'opere, releve, information due) - la projection, distincte du regulateur et de l'interne.",
      "evenement -> obligation envers le client"],
  ];
  const agrid=el("div",{style:"display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px"});
  actions.forEach(a=>{
    const c=el("div",{style:"border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);border-top:3px solid "+a[1]});
    c.appendChild(el("div",{style:"display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--ink)",html:'<span style="display:inline-flex;color:'+a[1]+'">'+ico(a[0])+'</span>'+a[2]}));
    c.appendChild(el("div",{class:"cap",style:"margin:6px 0 8px;padding:0;font-size:12px"},a[3]));
    c.appendChild(el("div",{style:"font-size:11px;font-weight:700;color:"+a[1]+";background:"+a[1]+"18;border-radius:8px;padding:4px 8px;display:inline-block"},a[4]));
    agrid.appendChild(c);
  });
  act.appendChild(agrid);

  // -- legende des etats --
  const leg=el("div",{style:"display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)"});
  [["Par defaut",CO.grey,"presente des la creation"],
   ["Activee a l'ouverture",CO.green,"entry / continuous"],
   ["En sommeil",CO.amber,"attend son evenement"],
   ["Activee sur evenement",CO.violet,"le fait est arrive"]].forEach(([l,c,h])=>{
    leg.appendChild(el("div",{style:"display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)",
      html:'<span style="width:10px;height:10px;border-radius:50%;background:'+c+';display:inline-block"></span><b style="color:var(--ink)">'+l+'</b> '+h}));
  });
  act.appendChild(leg);
  wrap.appendChild(act);

  return wrap;
}

function draw(){clearTimers();hideInfo();const m=document.getElementById('main');m.innerHTML="";
  let v;
  if(view==="parcours")v=parcoursView();
  else v=referentielView();
  m.appendChild(v);}
function syncTabs(){document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.getAttribute('data-v')===view));}
syncTabs();
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{view=b.getAttribute('data-v');try{location.hash=view;}catch(e){}syncTabs();draw();});
window.addEventListener('hashchange',()=>{const v=location.hash.replace('#','');if(VIEWS.includes(v)&&v!==view){view=v;syncTabs();draw();}});
// bascule clair / sombre (persistee par visiteur)
const themeBtn=document.getElementById('themeBtn');
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('pk-theme',t);}catch(e){}
  themeBtn.innerHTML=ico(t==="dark"?"sun":"moon")+'<span>'+(t==="dark"?"Clair":"Sombre")+'</span>';}
themeBtn.onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==="dark"?"light":"dark");
(function(){let t=null;try{t=localStorage.getItem('pk-theme');}catch(e){}if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?"dark":"light";setTheme(t);})();
draw();
</script>
